<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tantsiri - Exclusive Clothing Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- LOGIN / VERIFICATION SECTION -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-indigo-600">Tantsiri</h1>
                <p class="text-gray-500 text-sm mt-1">Sign in with your WhatsApp number</p>
            </div>
            
            <!-- Step 1: Phone Number -->
            <form id="phoneForm" onsubmit="prepareOtp(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">+91</span>
                        <input type="tel" id="whatsappNumber" required placeholder="Enter 10-digit number" pattern="[0-9]{10}" class="flex-1 min-w-0 block w-full px-3 py-2.5 rounded-none rounded-r-xl border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-xl font-medium hover:bg-green-700 transition shadow-lg shadow-green-100 flex items-center justify-center space-x-2">
                    <span>Generate OTP</span>
                </button>
            </form>

            <!-- Step 2: Simple Verify & Login -->
            <div id="otpSection" class="space-y-4 hidden mt-4">
                <div class="bg-green-50 border border-green-200 p-3 rounded-xl text-xs text-green-800 mb-3 text-center">
                    WhatsApp has opened to request your code. Once you receive it, enter it below:
                </div>

                <form onsubmit="verifyOtp(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1 text-center">Enter 4-Digit OTP</label>
                        <input type="text" id="otpInput" required placeholder="••••" maxlength="4" class="w-full px-3 py-3 rounded-xl border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-center tracking-widest text-2xl font-bold">
                    </div>
                    
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition shadow-lg shadow-indigo-100 text-base">
                        Verify & Login
                    </button>
                    
                    <button type="button" onclick="resetLogin()" class="w-full text-xs text-gray-500 hover:underline text-center mt-2 block">
                        Use a different number
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- CUSTOMER DASHBOARD -->
    <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold text-indigo-600">Tantsiri</span>
                    <span class="text-xs px-2.5 py-1 rounded-full font-medium bg-green-100 text-green-700">Customer</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userDisplay" class="text-sm font-medium text-gray-600"></span>
                    <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium">Logout</button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Our Collection</h2>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script>
        const STORE_OWNER_WHATSAPP = "919999999999"; // Replace with your actual WhatsApp phone number (with country code, no +)
        
        let products = JSON.parse(localStorage.getItem('tantsiri_products')) || [
            { id: 1, name: "Traditional Silk Saree", price: 2499, size: "Free Size", image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&q=80&w=600" },
            { id: 2, name: "Designer Anarkali Kurta", price: 1499, size: "M, L, XL", image: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&q=80&w=600" }
        ];

        let pendingPhone = "";
        let generatedOtp = "";

        let currentUser = localStorage.getItem('tantsiri_customer');
        if (currentUser) showDashboard(currentUser);

        function prepareOtp(event) {
            event.preventDefault();
            pendingPhone = document.getElementById('whatsappNumber').value.trim();
            
            // Generate a random 4 digit code
            generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
            
            // Open WhatsApp with pre-filled message requesting OTP
            const msg = encodeURIComponent(`Hi Tantsiri, please send my login OTP code. My phone number is +91 ${pendingPhone}.\n\n(Verification Code: ${generatedOtp})`);
            window.open(`https://wa.me/${STORE_OWNER_WHATSAPP}?text=${msg}`, '_blank');

            // Switch view to clean OTP input section
            document.getElementById('phoneForm').classList.add('hidden');
            document.getElementById('otpSection').classList.remove('hidden');
        }

        function verifyOtp(event) {
            event.preventDefault();
            const enteredOtp = document.getElementById('otpInput').value.trim();

            if (enteredOtp === generatedOtp) {
                localStorage.setItem('tantsiri_customer', pendingPhone);
                showDashboard(pendingPhone);
            } else {
                alert('Incorrect OTP! Please check the code sent from the owner.');
            }
        }

        function resetLogin() {
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('phoneForm').classList.remove('hidden');
            document.getElementById('whatsappNumber').value = '';
            document.getElementById('otpInput').value = '';
        }

        function showDashboard(phone) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = `+91 ${phone}`;
            renderProducts();
        }

        function logout() {
            localStorage.removeItem('tantsiri_customer');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            resetLogin();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">No products listed yet.</p>`;
                return;
            }
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between";
                const whatsappMsg = encodeURIComponent(`Hi, I am interested in buying this item from Tantsiri:\n\n*${product.name}*\nPrice: ₹${product.price}\nSize: ${product.size}`);
                card.innerHTML = `
                    <div>
                        <div class="h-64 overflow-hidden bg-gray-100 relative">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-5">
                            <h3 class="font-semibold text-lg text-gray-900">${product.name}</h3>
                            <p class="text-gray-500 text-sm mt-1">Sizes available: <span class="font-medium text-gray-700">${product.size}</span></p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center justify-between mt-4">
                        <span class="text-xl font-bold text-indigo-600">₹${product.price}</span>
                        <a href="https://wa.me/${STORE_OWNER_WHATSAPP}?text=${whatsappMsg}" target="_blank" class="bg-green-600 text-white text-sm px-4 py-2 rounded-xl font-medium hover:bg-green-700 transition flex items-center shadow-sm shadow-green-100">Order via WhatsApp</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
